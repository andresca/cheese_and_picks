<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Cheese Picks</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .container { max-width: 1200px; }
    .tabs { display: flex; gap: 6px; margin: 20px 0; flex-wrap: wrap; }
    .tabs button {
      border: 1px solid var(--line); background: #fff; padding: 9px 18px; border-radius: 999px;
      cursor: pointer; font: inherit; font-weight: 600; color: var(--muted);
    }
    .tabs button.active { background: var(--ink); color: #f5ead8; border-color: var(--ink); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi .v { font-size: 1.8rem; font-weight: 700; font-family: "Playfair Display", serif; }
    .kpi .l { color: var(--muted); font-size: .85rem; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
    .bar { display: grid; grid-template-columns: 130px 1fr 70px; align-items: center; gap: 8px; margin: 6px 0; font-size: .88rem; }
    .bar .track { background: #f1ebe1; border-radius: 6px; height: 14px; overflow: hidden; }
    .bar .fill { background: var(--accent); height: 100%; border-radius: 6px; }
    .bar .n { text-align: right; font-variant-numeric: tabular-nums; }
    .bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.t th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--line); padding: 8px 6px; }
    table.t td { border-bottom: 1px solid var(--line); padding: 8px 6px; vertical-align: middle; }
    table.t tr.clickable:hover { background: #fbf7f0; cursor: pointer; }
    .tablewrap { overflow-x: auto; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters input, .filters select { width: auto; flex: 1; min-width: 160px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(30, 20, 10, .5); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .modal { max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .login { max-width: 360px; margin: 80px auto; }
    td input, td select { padding: 6px 8px; }
    td input[type=checkbox] { width: auto; }
    .section-h { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 10px; gap: 10px; flex-wrap: wrap; }
    .subtabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
    .subtabs button { border: 0; background: none; padding: 10px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .subtabs button.active { color: var(--accent); border-color: var(--accent); }
    /* draggable lists */
    .dlist { display: flex; flex-direction: column; gap: 6px; }
    .drow { display: grid; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .cat-row { grid-template-columns: 22px minmax(150px, 1fr) minmax(180px, 2fr) auto auto auto auto; }
    .prod-row, .drow.head { grid-template-columns: 22px minmax(150px, 1fr) minmax(180px, 2fr) 110px 100px 50px auto; }
    .drow.head { border: 0; background: none; padding: 0 10px; font-size: .8rem; color: var(--muted); font-weight: 600; }
    .drow input, td.stack input { padding: 6px 8px; }
    .stack { display: flex; flex-direction: column; gap: 4px; }
    .num { width: 100%; }
    .handle { cursor: grab; color: var(--muted); font-size: 1.2rem; user-select: none; text-align: center; }
    .dragging { opacity: .4; }
    .drop-over { box-shadow: 0 -3px 0 var(--accent); }
    .group.drop-over { box-shadow: none; outline: 2px dashed var(--accent); }
    .inactive { opacity: .55; }
    .tog { display: flex; gap: 6px; align-items: center; font-weight: 400; white-space: nowrap; }
    .tog input { width: auto; }
    .pill { font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: #f1ebe1; color: var(--muted); white-space: nowrap; }
    .pill.lim { background: var(--accent-soft); color: var(--accent); }
    .group { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 12px; background: #fdfaf5; }
    .group-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .fold { border: 0; background: none; cursor: pointer; font-size: 1rem; color: var(--muted); padding: 0 4px; }
    .empty-drop { border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); font-size: .9rem; }
    .savebar { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 150%); transition: transform .2s; display: flex; gap: 10px; align-items: center;
      background: var(--ink); color: #f5ead8; padding: 10px 14px 10px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 5; }
    .savebar.show { transform: translate(-50%, 0); }
    .savebar .ghost { color: #f5ead8; border-color: #f5ead8; }
    .size-grid { display: flex; flex-direction: column; gap: 18px; }
    .sc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .sc-body { display: grid; grid-template-columns: 1fr 260px; gap: 24px; margin-top: 6px; }
    .sc-body h4 { margin: 18px 0 8px; font-size: 1rem; }
    .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .choice label { display: flex; flex-direction: column; gap: 2px; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 400; }
    .choice label.on { border-color: var(--accent); background: var(--accent-soft); }
    .choice input { width: auto; align-self: flex-start; }
    table.inc td, table.inc th { padding: 6px; }
    .preview-card { position: sticky; top: 16px; align-self: start; border: 2px dashed var(--line); border-radius: 12px; padding: 14px; background: #fdfaf5; }
    .preview-card ul { padding-left: 18px; margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
    .pv-price { font-weight: 700; color: var(--accent); margin: 4px 0; }
    .warn { color: #b3261e; }
    @media (max-width: 800px) { .sc-body, .choice { grid-template-columns: 1fr; } .preview-card { position: static; } }
    /* operations tab */
    .ing-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    .ing-grid .mlbl { font-size: .75rem; color: var(--muted); font-weight: 600; }
    .rline { display: grid; grid-template-columns: minmax(140px, 1fr) 90px 36px auto; gap: 6px; align-items: center; }
    .rline input, .rline select { padding: 6px 8px; }
    @media (max-width: 800px) { .ing-grid { grid-template-columns: 1fr 1fr; } }
    .touch-only { display: none; }
    @media (hover: none) { .touch-only { display: inline-flex; gap: 2px; } .handle { display: none; } }
    @media (max-width: 800px) {
      .cat-row, .prod-row { grid-template-columns: 1fr 1fr; }
      .cat-row .stack, .prod-row .stack { grid-column: 1 / -1; }
      .drow.head { display: none; }
    }
    /* grid/flex children may shrink below their content, so wide tables scroll instead of widening the page */
    .two > *, .sc-body > *, .drow > * { min-width: 0; }
    .tog > span { white-space: normal; }
    .cell { display: block; margin: 0; font-weight: 400; }
    .mlbl { display: none; }
    header.site .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    @media (max-width: 800px) {
      .mlbl { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; }
      .tog .mlbl { display: inline; }
    }
    @media (max-width: 600px) {
      header.site { padding: 14px 0; }
      header.site .container { flex-direction: column; align-items: stretch; gap: 10px; }
      header.site h1 { font-size: 1.3rem; }
      header.site .actions { justify-content: space-between; }
      /* tabs: one swipeable row instead of wrapping onto two */
      .tabs { flex-wrap: nowrap; overflow-x: auto; margin: 14px -16px; padding: 0 16px 4px; scrollbar-width: none; }
      .tabs button { flex: none; padding: 8px 14px; }
      .subtabs button { flex: 1; padding: 10px 8px; font-size: .9rem; }
      .card { padding: 14px; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
      .kpi .v { font-size: 1.35rem; overflow-wrap: anywhere; }
      .two { gap: 12px; margin-bottom: 12px; }
      .bar { grid-template-columns: 92px 1fr 64px; font-size: .82rem; }
      .filters input, .filters select { min-width: 0; flex: 1 1 100%; }
      .filters input[type=date] { flex: 1 1 40%; }
      .filters .btn { flex: 1 1 100%; }
      .section-h #pq { max-width: none !important; }
      .group { padding: 8px; }
      .group-h .btn { margin-left: 0 !important; width: 100%; }
      table.inc input { width: 60px !important; }
      /* "what's included": category + two inputs on one line, the hint underneath */
      table.inc, table.inc tbody { display: block; }
      table.inc tr { display: grid; grid-template-columns: 1fr 68px 68px; align-items: center; border-bottom: 1px solid var(--line); }
      table.inc th, table.inc td { border: 0; }
      table.inc th:nth-child(4) { display: none; }
      table.inc td:nth-child(4) { grid-column: 1 / -1; padding-top: 0; }
      .modal-bg { padding: 0; place-items: end stretch; }
      .modal { max-height: 92vh; border-radius: var(--radius) var(--radius) 0 0; }
      .savebar { left: 12px; right: 12px; bottom: 12px; transform: translateY(150%); justify-content: space-between; border-radius: 16px; }
      .savebar.show { transform: translateY(0); }
      .login { margin: 40px auto; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="container">
      <div><h1>Cheese Picks · Admin</h1><small data-i18n="adminSub"></small></div>
      <div class="actions"><span id="langBox"></span><a href="/" target="_blank" style="color:#f5ead8" data-i18n="viewStore"></a> <button class="btn small ghost" id="logout" style="color:#f5ead8;border-color:#f5ead8;display:none" data-i18n="logout"></button></div>
    </div>
  </header>
  <main class="container" id="app"></main>
  <script src="i18n.js"></script>
  <script src="admin.js"></script>
  <script src="admin-ops.js"></script>
</body>
</html>
