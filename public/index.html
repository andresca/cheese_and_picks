<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheese Picks — Build your cheese table</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .stepper { display: flex; gap: 6px; margin: 24px 0; overflow-x: auto; padding-bottom: 4px; }
    .stepper .s {
      flex: 1; min-width: 92px; text-align: center; font-size: .8rem; color: var(--muted);
      border-top: 4px solid var(--line); padding-top: 6px; white-space: nowrap;
    }
    .stepper .s.done { border-color: var(--gold); color: var(--ink); }
    .stepper .s.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .layout { display: grid; grid-template-columns: 1fr 290px; gap: 20px; align-items: start; margin-bottom: 40px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .option {
      border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer;
      background: #fff; transition: border-color .15s, transform .15s; position: relative; user-select: none;
    }
    .option:hover { border-color: var(--gold); }
    .option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .option.disabled { opacity: .45; cursor: not-allowed; }
    .option .price { font-weight: 700; color: var(--accent); }
    .option .check {
      position: absolute; top: 10px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: #fff;
    }
    .option.selected .check { background: var(--accent); border-color: var(--accent); }
    .size-card h3 { font-size: 1.4rem; }
    .size-card ul { padding-left: 18px; margin: 8px 0 0; color: var(--muted); font-size: .9rem; }

    .counter { margin: 4px 0 16px; font-weight: 600; }
    .nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }

    .cart h3 { font-size: 1.15rem; }
    .cart .line { display: flex; justify-content: space-between; font-size: .9rem; padding: 3px 0; gap: 8px; }
    .cart .cat { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 10px; }
    .cart .total { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-weight: 700; font-size: 1.1rem; }
    .sticky { position: sticky; top: 16px; }

    .summary table { width: 100%; border-collapse: collapse; }
    .summary td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .summary td:last-child { text-align: right; }
    .seg { display: flex; gap: 8px; margin-bottom: 14px; }
    .seg .option { flex: 1; text-align: center; padding: 12px; }
    .hero { text-align: center; padding: 30px 0 0; }
    .hero p { max-width: 560px; margin: 0 auto; }
    .success { text-align: center; padding: 40px 20px; }
    .success .big { font-size: 3rem; }
  </style>
</head>
<body>
  <header class="site photo">
    <div class="container">
      <div class="brand"><span class="eyebrow">Fromagerie &amp; Vin</span><h1 id="bizName">Cheese Picks</h1><span class="rule"></span><small data-i18n="tagline"></small></div>
      <div id="langBox" class="langbox"></div>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h2 data-i18n="heroTitle"></h2>
      <p class="muted" data-i18n="heroText"></p>
    </div>
    <div class="stepper" id="stepper"></div>
    <div class="layout">
      <section class="card" id="stepBody"></section>
      <aside class="card cart sticky" id="cart"></aside>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
