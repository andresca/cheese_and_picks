<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d12"/>
      <stop offset="1" stop-color="#4a2f1a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#f6c94c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#d48f1c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- wedge top face -->
  <path d="M12 36 L44 16 L54 32 Z" fill="url(#top)"/>
  <!-- wedge front face -->
  <path d="M12 36 L54 32 L54 46 L12 50 Z" fill="url(#side)"/>
  <!-- rind edge highlight -->
  <path d="M12 36 L54 32" stroke="#fff4cc" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <!-- holes -->
  <ellipse cx="22" cy="43" rx="3.2" ry="2.6" fill="#b87414"/>
  <ellipse cx="36" cy="41" rx="2.4" ry="2" fill="#b87414"/>
  <ellipse cx="47" cy="40.5" rx="1.8" ry="1.5" fill="#b87414"/>
  <ellipse cx="40" cy="25" rx="2.2" ry="1.4" fill="#e3a93a"/>
</svg>
